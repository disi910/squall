name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      # The tests regenerate the dataset in memory, check it against the schema, and check
      # that the committed JSON Schema files are up to date.
      - run: npm test
      # The acceptance check from the brief: generate the data, then build the static site.
      - run: npm run generate && npm run build

  harness:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: harness
    steps:
      - uses: actions/checkout@v4
      # Node is needed for the export test, which checks output with the TypeScript validator.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        working-directory: .
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pyright
      # Every test uses Inspect's mockllm model or scripted agents: no API key, no cost.
      - run: uv run pytest -q
