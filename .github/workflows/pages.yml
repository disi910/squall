# Deploys the site to GitHub Pages. Manual only: enable Pages (Settings → Pages →
# Source: GitHub Actions) before running it from the Actions tab.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/copy-dataset.mjs datasets/haiku-trial
      # Pages serves the site from /<repo-name>/, so the router and data paths need that base.
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      # Pages has no rewrites: serving index.html as the 404 page lets deep links like /runs/abc load the app.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
