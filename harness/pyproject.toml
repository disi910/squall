[project]
name = "squall-harness"
version = "0.1.0"
description = "Fault-injection harness for tool-using LLM agents: runs Squall tasks with Inspect and exports Squall datasets."
requires-python = ">=3.12,<3.13"
dependencies = [
  "inspect-ai==0.3.292",
  "anthropic==2.13.0",
  "pydantic[email]==2.14.4",
]

[project.scripts]
squall-harness = "squall_harness.cli:main"

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "ruff==0.17.6",
  "pyright==1.1.414",
  "datamodel-code-generator==0.101.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/squall_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/squall_harness/models.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["src/squall_harness/models.py"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
